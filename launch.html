<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open TrelloClaude</title><style>body{font:14px -apple-system,BlinkMacSystemFont,sans-serif;margin:20px;color:#172b4d}button{padding:8px 12px;border:0;border-radius:5px;background:#0c66e4;color:#fff;cursor:pointer}</style></head>
<body><p id="message">Opening TrelloClaude…</p><button id="retry" hidden>Retry</button><script>(()=>{const target=`trelloclaude://open?${location.search.slice(1)}`;const message=document.getElementById('message');const retry=document.getElementById('retry');const open=()=>{location.href=target};retry.addEventListener('click',open);open();setTimeout(()=>{message.textContent='TrelloClaude launcher is not installed or could not be opened.';retry.hidden=false},1500)})();</script></body></html>
