<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open TrelloClaude</title><style>body{font:14px -apple-system,BlinkMacSystemFont,sans-serif;margin:20px;color:#172b4d}button{padding:8px 12px;border:0;border-radius:5px;background:#0c66e4;color:#fff;cursor:pointer}</style></head>
<body><p id="message">Opening TrelloClaude…</p><p>If the launcher does not appear, retry the handoff.</p><button id="retry">Retry</button><script>(()=>{const target=`trelloclaude://open?${location.search.slice(1)}`;const retry=document.getElementById('retry');const open=()=>{location.href=target};retry.addEventListener('click',open);open()})();</script></body></html>
