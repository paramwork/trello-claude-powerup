<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open TrelloClaude</title><style>body{font:14px -apple-system,BlinkMacSystemFont,sans-serif;margin:16px;color:#172b4d;line-height:1.35}p{margin:0 0 10px}button{padding:9px 12px;border:0;border-radius:5px;background:#0c66e4;color:#fff;cursor:pointer;font:inherit;font-weight:600}button:disabled{opacity:.55;cursor:wait}small{display:block;margin-top:10px;color:#5e6c84}.error{color:#ae2e24}</style></head>
<body><p id="message">Loading card details…</p><button id="open" disabled>Open TrelloClaude</button><small>macOS may ask for permission to open the launcher.</small><script src="https://p.trellocdn.com/power-up.min.js"></script><script>(()=>{const message=document.getElementById('message');const button=document.getElementById('open');const text=value=>typeof value==='string'?value:'';const clipped=(value,max)=>{const string=text(value);return string.length>max?`${string.slice(0,max-1)}…`:string};const query=values=>new URLSearchParams(Object.entries(values).filter(([,value])=>value!==undefined&&value!==null&&value!=='')).toString();let target='';button.addEventListener('click',()=>{if(target)location.href=target});(async()=>{try{const t=TrelloPowerUp.iframe();const[card,board,list]=await Promise.all([t.card('id','name','desc','url','shortLink'),t.board('id','name'),t.list('id','name')]);target=`trelloclaude://open?${query({v:'1',cardId:card.id,cardUrl:card.url,shortLink:card.shortLink,title:card.name,boardId:board.id,boardName:board.name,listId:list.id,listName:list.name,desc:clipped(card.desc,1800),labels:'',due:'',checklist:''})}`;message.innerHTML='<strong>Ready to start Claude on this card.</strong>';button.disabled=false}catch(error){message.textContent='Could not read this Trello card. Close this popup and try again.';message.className='error'}})()})();</script></body></html>
